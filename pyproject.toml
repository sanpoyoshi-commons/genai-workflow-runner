[project]
name = "gwr"
version = "0.1.0"
description = "TOMLで多段のAI業務ワークフローを定義・実行する汎用ランナー（完全オリジナル・Apache-2.0）。ガバメントAI 源内 OSS の genai-web プロトコル準拠AIアプリとして接続可能"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "rifu.sakamoto" }]
keywords = ["workflow", "toml", "genai", "源内"]
dependencies = [
    "jmespath>=1.0",       # MIT — 参照解決
    "cel-python>=0.1.5",   # Apache-2.0 — 条件式（when）評価
    "pandas>=2.2",         # BSD-3 — file.transform
    "openpyxl>=3.1",       # MIT — xlsx 入出力
]

[project.optional-dependencies]
mcp = [
    "mcp==2.2.0",          # MIT — MCP サーバ（stdio）。`gwr mcp` のみで使う
]
serve = [
    "fastapi>=0.110",      # MIT — /invoke HTTP 層
    "uvicorn>=0.29",       # BSD-3
]
http = [
    "httpx>=0.27",         # BSD-3 — 委譲先 API への本番 HTTP 接続
]

[project.scripts]
gwr = "gwr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",         # serve のテストクライアント用
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real: 実機（onpre）に接続する env-gated テスト。接続 env 未設定なら skip。",
]

[tool.coverage.run]
source = ["gwr"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["gwr"]
ignore_missing_imports = true
warn_unused_ignores = true
